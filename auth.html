<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>
	<body>
		<div
			style="display: flex; justify-content: space-between; padding: 0px 100px"
		>
			<div id="notes">Loading....</div>
			<div> 
				<input type="text" id="userNote" />
				<button onclick="addTodo()">Create New Note</button>
			</div>
		</div>
		<script>
			async function addTodo() {
				await axios.post('http://localhost:3000/notes', {
					note: document.getElementById('userNote').value,
				},{
					headers: {
						token: localStorage.getItem('token')
					}
				});
				const newNode = document.createElement('div');
				newNode.innerHTML = document.getElementById('userNote').value;
				newNode.setAttribute(
					'style',
					'border: 2px solid black; padding: 10px; margin: 10px',
				);
				document.getElementById('notes').appendChild(newNode);
				document.getElementById('userNote').value = '';
			}
			async function getTodos() {
				const response = await axios.get('http://localhost:3000/notes',{
					headers: {
						token: localStorage.getItem('token')
					}
				});
				const notes = response.data.notes;
				console.log(response.data.notes);
				document.getElementById('notes').innerHTML = '';
				for (let i = 0; i < response.data.notes.length; i++) {
					const noteElement = document.createElement('div');
					noteElement.innerHTML = notes[i].note;
					noteElement.setAttribute(
						'style',
						'border: 2px solid black; padding: 10px; margin: 10px',
					);
					document.getElementById('notes').appendChild(noteElement);
				}
			}
			getTodos();
		</script>
	</body>
</html>
